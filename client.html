<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Client</title><style>:root{--bg:#f4f5f9;--card:#fff;--ink:#16213e;--mut:#6a7390;--bd:#e3e6ef;--navy:#14213d;--navy2:#26417a;--gold:#ffb703;--gold2:#fb8500;--ok:#12a36b;--bad:#e5383b;--acc:#fb8500;--kpi:#26417a;--sh:0 6px 22px rgba(20,33,61,.08)}
@media(prefers-color-scheme:dark){:root{--bg:#0d1325;--card:#161f38;--ink:#eef1fb;--mut:#93a0c4;--bd:#27345a;--kpi:#ffc93c;--sh:0 6px 22px rgba(0,0,0,.35)}}
*{box-sizing:border-box}
body{margin:0;font:15px/1.55 "Segoe UI",system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink)}
h2,h3{margin:.2em 0 .4em;letter-spacing:-.2px}
#hdr{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 20px;background:linear-gradient(120deg,#0f1a33,#26417a);color:#fff;position:sticky;top:0;z-index:5;box-shadow:0 4px 16px rgba(0,0,0,.2)}
#hdr>b{font-size:17px;display:flex;align-items:center;gap:8px}#hdr>b:before{content:"";width:10px;height:10px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 3px rgba(255,183,3,.3)}
#net{font-size:12px;padding:3px 10px;border-radius:99px;background:rgba(18,163,107,.25);color:#7dffc9}#net.off{background:rgba(229,56,59,.3);color:#ffb3b5}
#hdr .lang{display:inline-flex;background:rgba(255,255,255,.12);border-radius:99px;padding:3px;gap:2px}
nav{display:flex;gap:8px;flex-wrap:wrap;padding:12px 18px;background:var(--card);border-bottom:1px solid var(--bd);position:sticky;top:56px;z-index:4;overflow-x:auto}
main{max-width:1000px;margin:0 auto;padding:18px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:var(--sh)}
.col{display:flex;flex-direction:column;gap:10px}.col>.card{margin-bottom:0}
.col>.card:has(.kpi){border-inline-start:6px solid var(--gold)}
.col>.card:nth-child(2):has(.kpi){border-color:var(--ok)}.col>.card:nth-child(3):has(.kpi){border-color:var(--navy2)}.col>.card:nth-child(4):has(.kpi){border-color:var(--gold2)}
.kpi{font-size:30px;font-weight:800;color:var(--kpi);line-height:1.2}.mut{color:var(--mut);font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row>.g{flex:1}
input,select,textarea{font:inherit;padding:10px 12px;border-radius:10px;border:1.5px solid var(--bd);background:var(--card);color:var(--ink);transition:border .15s,box-shadow .15s}
input:focus,select:focus{outline:0;border-color:var(--gold2);box-shadow:0 0 0 3px rgba(251,133,0,.25)}
button{font:inherit;font-weight:700;cursor:pointer;padding:10px 18px;border-radius:12px;border:0;color:#1b1400;background:linear-gradient(135deg,var(--gold),var(--gold2));box-shadow:0 4px 12px rgba(251,133,0,.35);transition:transform .15s,box-shadow .15s,filter .15s}
button:hover{transform:translateY(-2px);filter:brightness(1.05);box-shadow:0 8px 18px rgba(251,133,0,.4)}
button:active{transform:none}button:focus-visible{outline:3px solid var(--navy2);outline-offset:2px}
button:disabled{opacity:.4;cursor:not-allowed;transform:none;box-shadow:none}
button.sec{background:transparent;color:var(--ink);border:1.5px solid var(--bd);box-shadow:none}
button.sec:hover{border-color:var(--navy2);color:var(--navy2);box-shadow:none}
@media(prefers-color-scheme:dark){button.sec:hover{border-color:var(--gold);color:var(--gold)}}
button.bad{background:linear-gradient(135deg,#e5383b,#b1252a);color:#fff;box-shadow:0 4px 12px rgba(229,56,59,.35)}
nav button{background:transparent;color:var(--ink);border:1.5px solid var(--bd);box-shadow:none;padding:8px 16px;white-space:nowrap}
nav button:hover{border-color:var(--navy2);box-shadow:none}
nav button.on{background:linear-gradient(135deg,#14213d,#26417a);color:var(--gold);border-color:transparent;box-shadow:0 4px 12px rgba(20,33,61,.35)}
#hdr .lang button{background:transparent;box-shadow:none;padding:4px 11px;font-size:12px;color:#fff;border-radius:99px}
#hdr .lang button.on{background:var(--gold);color:#1b1400}
#hdr #lo{background:rgba(255,255,255,.14);color:#fff;box-shadow:none;border:1px solid rgba(255,255,255,.4);padding:6px 14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.grid button{padding:16px 8px;background:var(--card);color:var(--ink);border:1.5px solid var(--bd);border-radius:14px;box-shadow:none;line-height:1.3}
.grid button b{color:var(--gold2);font-size:15px}.grid button:hover{border-color:var(--gold2);background:rgba(255,183,3,.12);box-shadow:var(--sh)}
table{width:100%;border-collapse:collapse}th{font-size:12px;color:var(--mut);text-transform:none;background:rgba(38,65,122,.07)}
td,th{padding:9px 8px;border-bottom:1px solid var(--bd);text-align:start}tr:hover td{background:rgba(255,183,3,.07)}
.badge{padding:3px 11px;border-radius:99px;background:rgba(255,183,3,.25);color:#8a5a00;font-size:12px;font-weight:700}
.badge[data-s="acceptée"],.badge[data-s="préparée"]{background:rgba(38,65,122,.15);color:var(--navy2)}
.badge[data-s="en route"]{background:rgba(251,133,0,.2);color:#b45f00}
.badge[data-s="terminée"]{background:rgba(18,163,107,.18);color:#0a7a4f}
.badge[data-s="refusée"],.badge[data-s="annulée"]{background:rgba(229,56,59,.15);color:#c1272b}
.logo{width:58px;height:58px;border-radius:14px;object-fit:cover;background:linear-gradient(135deg,var(--gold),var(--gold2))}
.toast{position:fixed;bottom:18px;inset-inline-end:18px;background:var(--navy);color:#fff;padding:13px 18px;border-radius:12px;z-index:20;border-inline-start:5px solid var(--gold);box-shadow:0 10px 30px rgba(0,0,0,.35)}
iframe{width:100%;height:280px;border:0;border-radius:12px}
#receipt{display:none;font:13px monospace;width:72mm}
@media print{body>*{display:none!important}#receipt{display:block!important}.pcard{display:block!important}}
.bizcard{width:340px;border:3px solid var(--gold2);border-radius:18px;padding:22px;text-align:center;margin:20px auto;background:#fff;color:#14213d;box-shadow:var(--sh)}
body.auth{background:radial-gradient(circle at 15% 0,#2f5aa8 0,#14213d 55%) fixed;min-height:100vh}
body.auth #hdr{background:transparent;box-shadow:none;position:static}
body.auth main{padding-top:0}body.auth .card{box-shadow:0 24px 70px rgba(0,0,0,.45);border:0;border-radius:22px;padding:26px}
.brand{font-size:26px;font-weight:800;margin:0}.brand span{color:var(--gold2)}
body.auth #hdr>b{display:none}body.auth #hdr{justify-content:flex-end}
nav{position:static;flex-wrap:nowrap;scrollbar-width:thin}#hdr{position:static}
.gal{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;margin-bottom:10px}.gal.ph{height:90px;align-items:center;justify-content:center;font-size:34px;background:rgba(255,183,3,.15);border-radius:12px}
.gi{position:relative;flex:0 0 auto;scroll-snap-align:start}.gi img{height:150px;max-width:260px;object-fit:cover;border-radius:12px;display:block}
.gi .x{position:absolute;top:6px;inset-inline-end:6px;padding:2px 8px;border-radius:99px;background:rgba(20,33,61,.8);color:#fff;box-shadow:none;font-size:12px}
.cat{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}.dish{margin:0}.dish p{margin:6px 0}
.lb{display:inline-block;cursor:pointer;padding:9px 16px;border-radius:12px;border:1.5px solid var(--bd);font-weight:700}.lb:hover{border-color:var(--navy2)}
textarea{width:100%;font:inherit}
.pv{margin:10px 0 0}.pvi{flex:0 0 130px;cursor:pointer;scroll-snap-align:start;font-size:13px}.pvi img,.pvi .ph2{width:130px;height:90px;object-fit:cover;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:28px;background:rgba(255,183,3,.15)}.pvi b,.pvi span{display:block}.pvi span{color:var(--acc);font-weight:700}
.warn{border-inline-start:6px solid var(--gold);background:rgba(255,183,3,.12)}.okc{border-inline-start:6px solid var(--ok)}
.badge[data-s="pro"]{background:rgba(18,163,107,.18);color:#0a7a4f}.badge[data-s="off"]{background:rgba(229,56,59,.15);color:#c1272b}

/* Home grid navigation for restaurant space */
.home-grid-wrap{max-width:420px;margin:0 auto}
.home-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.home-grid .hg-btn{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
  background:#14213d;color:#fff;border:0;border-radius:16px;padding:22px 12px;
  font-weight:700;font-size:14px;line-height:1.25;text-align:center;
  box-shadow:0 6px 18px rgba(20,33,61,.25);min-height:110px;
  transition:transform .15s,filter .15s,box-shadow .15s
}
.home-grid .hg-btn:hover{transform:translateY(-3px);filter:brightness(1.08);box-shadow:0 10px 24px rgba(20,33,61,.35)}
.home-grid .hg-btn .ico{font-size:28px;line-height:1;filter:drop-shadow(0 2px 4px rgba(0,0,0,.2))}
.home-grid .hg-btn.full{grid-column:1/-1;flex-direction:row;min-height:64px;gap:12px;padding:16px 20px}
.home-grid .hg-btn .badge{background:var(--gold);color:#1b1400;margin-inline-start:4px}
.back-row{margin-bottom:12px}
.back-row button{background:transparent;color:var(--ink);border:1.5px solid var(--bd);box-shadow:none;padding:8px 14px}
.back-row button:hover{border-color:var(--navy2);color:var(--navy2)}
@media(prefers-color-scheme:dark){
  .home-grid .hg-btn{background:#1a2744}
  .back-row button:hover{border-color:var(--gold);color:var(--gold)}
}

nav:empty{display:none;padding:0;border:0;height:0;overflow:hidden}

.back-row{margin-bottom:14px}
.back-btn{
  display:inline-flex;align-items:center;gap:6px;
  background:linear-gradient(135deg,#14213d,#26417a)!important;
  color:#ffb703!important;border:0!important;
  padding:12px 18px!important;border-radius:12px!important;
  font-weight:700!important;box-shadow:0 4px 12px rgba(20,33,61,.35)!important;
}
.back-btn:hover{filter:brightness(1.1);transform:translateY(-1px)}

.menu-search{width:100%;margin:10px 0 14px;padding:12px 14px;border-radius:12px;border:1.5px solid var(--bd);font:inherit}
.cart-bar{position:sticky;bottom:12px;z-index:6;background:linear-gradient(135deg,#14213d,#26417a);color:#fff;border-radius:16px;padding:14px 16px;box-shadow:0 10px 28px rgba(20,33,61,.35);display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.cart-bar b{color:#ffb703}
.gps-box{border:1.5px dashed var(--bd);border-radius:14px;padding:12px;background:rgba(38,65,122,.06)}
.gps-ok{border-color:var(--ok);background:rgba(18,163,107,.1)}
.gps-need{border-color:var(--gold2);background:rgba(255,183,3,.12)}
.qty-row{display:flex;align-items:center;gap:8px}
.qty-row span{min-width:28px;text-align:center;font-weight:700}

  if(u.pass!==old)return alert('Mot de passe actuel incorrect.');
  if(nw.length<6)return alert('Le nouveau mot de passe doit contenir au moins 6 caractères.');
  if(nw!==cf)return alert('Les deux nouveaux mots de passe ne correspondent pas.');
  if(nw===old)return alert('Choisissez un mot de passe différent de l\'actuel.');

 <div class="card col">
  <b>Votre panier ${nItems?`(${nItems} article${nItems>1?'s':''})`:''}</b>
  ${items.length?`<div>${items.map(i=>`${esc(i.n)} ×${i.q} — ${money(i.p*i.q,r.currency)}`).join('<br>')}</div><div class="kpi" style="font-size:22px">${money(tot,r.currency)}</div>`:'<p class="mut">Ajoutez plusieurs plats avec les boutons + / −.</p>'}
  <input id="ad" placeholder="Adresse / complément (quartier, porte, repère)">
  <div class="gps-box ${gpsClass}" id="gpsbox">
   <div id="gpsmsg" class="mut">${gpsText}</div>
   <div class="row" style="margin-top:8px">
    <button type="button" class="sec" onclick="capturePos()">📍 ${pos?'Actualiser ma position':'Activer ma localisation GPS'}</button>
    <span id="gpsmap">${pos?`<a target="_blank" rel="noopener" href="https://www.google.com/maps?q=${pos[0]},${pos[1]}">Voir sur Google Maps</a>`:''}</span>
   </div>
  </div>
  <select id="py" onchange="document.getElementById('pyInfo').textContent=this.selectedOptions[0].dataset.d||''"><option>Paiement à la livraison</option>${(r.payMethods||r.pay.map(n=>({name:n}))).map(p=>`<option data-d="${esc(p.details||'')}">${esc(p.name)}</option>`).join('')}</select><div id="pyInfo" class="mut"></div>
  <button onclick="order()" ${tot?'':'disabled'}>Commander ${tot?money(tot,r.currency):''}</button>
  <p class="mut">La localisation GPS est obligatoire pour envoyer la commande au restaurant et au livreur.</p>
 </div>
 ${nItems?`<div class="cart-bar"><span>🛒 <b>${nItems}</b> plat${nItems>1?'s':''} · <b>${money(tot,r.currency)}</b></span><button onclick="document.getElementById('ad')?.scrollIntoView({behavior:'smooth'})">Voir le panier</button></div>`:''}`}
function renderDishes(r,dishes){
 if(!dishes.length)return '<p class="mut">Aucun plat ne correspond à votre recherche.</p>';
 return dishes.map((p,idx)=>{
  const key=p.n;
  const qty=cart[key]||0;
  return `<div class="card">${gal(p.imgs)}<div class="row"><div class="g"><b>${esc(p.n)}</b><div class="mut">${esc(p.desc||'')}</div><b style="color:var(--acc)">${money(p.p,r.currency)}</b></div>
  <div class="qty-row"><button class="sec" type="button" onclick="qByName(${JSON.stringify(key)},-1)">−</button><span>${qty}</span><button type="button" onclick="qByName(${JSON.stringify(key)},1)">+</button></div></div></div>`}).join('')}
function renderMenuOnly(){
 const r=D.get().rests.find(r=>r.id==cur);if(!r)return;
 const q=(menuQ||'').trim().toLowerCase();
 const dishes=r.menu.filter(p=>!q||(p.n||'').toLowerCase().includes(q)||(p.desc||'').toLowerCase().includes(q));
 const el=document.getElementById('menuList');
 if(el)el.innerHTML=renderDishes(r,dishes);
 // keep search focus/caret roughly
 const s=document.getElementById('menuSearch');if(s){s.focus();try{s.setSelectionRange(s.value.length,s.value.length)}catch(e){}}
}
function showGPS(){
 const msg=document.getElementById('gpsmsg'),map=document.getElementById('gpsmap'),box=document.getElementById('gpsbox');
 if(!pos)return;
 if(msg)msg.textContent='✅ Position GPS enregistrée : '+pos[0].toFixed(5)+', '+pos[1].toFixed(5);
 if(map)map.innerHTML='<a target="_blank" rel="noopener" href="https://www.google.com/maps?q='+pos[0]+','+pos[1]+'">Voir sur Google Maps</a>';
 if(box){box.classList.remove('gps-need');box.classList.add('gps-ok')}
}
function capturePos(done){
 if(!navigator.geolocation){alert('La géolocalisation n’est pas disponible sur cet appareil.');return}
 const msg=document.getElementById('gpsmsg');if(msg)msg.textContent='Recherche de votre position GPS…';
 navigator.geolocation.getCurrentPosition(
  p=>{pos=[p.coords.latitude,p.coords.longitude];window._clientGpsAccuracy=Math.round(p.coords.accuracy);showGPS();toast('Position GPS activée');if(typeof done==='function')done()},
  e=>{if(msg)msg.textContent='❌ Position non obtenue. Activez le GPS et autorisez la localisation.';alert('Impossible de récupérer votre position.\\n\\n1. Activez le GPS du téléphone\\n2. Autorisez la localisation pour ce site\\n3. Réessayez');},
  {enableHighAccuracy:true,timeout:20000,maximumAge:0}
 )}
function qByName(n,v){cart[n]=Math.max(0,(cart[n]||0)+v);if(!cart[n])delete cart[n];render()}
function order(){
 const r=D.get().rests.find(r=>r.id==cur);
 const items=(r?.menu||[]).filter(p=>cart[p.n]>0).map(p=>({n:p.n,p:p.p,q:cart[p.n]}));
 if(!items.length)return alert('Ajoutez au moins un plat dans votre panier.');
 // Localisation OBLIGATOIRE
 if(!pos){
  alert('Vous devez activer votre localisation GPS avant de commander.\\nLe restaurant et le livreur recevront vos coordonnées sur Google Maps.');
  return capturePos(()=>order());
 }
 const addrEl=document.getElementById('ad');
 const pyEl=document.getElementById('py');
 const d=D.get();
 d.orders.push({
  id:uid(),
  restId:r.id,
  clientId:U.id,
  clientName:U.name,
  clientPhone:U.phone,
  items,
  total:items.reduce((a,i)=>a+i.p*i.q,0),
  status:'en attente',
  pay:pyEl?pyEl.value:'Paiement à la livraison',
  addr:(addrEl&&addrEl.value.trim())||'Position GPS du client',
  cLat:pos[0],
  cLng:pos[1],
  locationAccuracy:window._clientGpsAccuracy||null,
  locationCapturedAt:Date.now(),
  created:Date.now()
 });
 D.save(d);
 cart={};cur=null;tab='myorders';menuQ='';
 notify('Commande envoyée ✓','Le restaurant '+r.name+' a reçu votre position GPS');
 render();
}
function orders(){const d=D.get();return d.orders.filter(o=>o.clientId==U.id).reverse().map(o=>{const r=d.rests.find(r=>r.id==o.restId),i=ST.indexOf(o.status),end=['refusée','annulée'].includes(o.status);
 const dest=o.cLat!=null?o.cLat+','+o.cLng:encodeURIComponent(o.addr),src=o.driverPos?o.driverPos.join(','):'';
 return `<div class="card"><div class="row"><b>${esc(r?.name)}</b> <span class="badge" data-s="${o.status}">${o.status}</span><span class="mut">#${o.id} — ${fdate(o.created)}</span></div>
 <div>${o.items.map(x=>`${esc(x.n)} ×${x.q}`).join(', ')} — <b>${money(o.total,r?.currency)}</b></div>
 ${o.cLat!=null?`<div class="mut">📍 Position envoyée : <a target="_blank" rel="noopener" href="https://www.google.com/maps?q=${o.cLat},${o.cLng}">Voir sur Google Maps</a></div>`:''}
 ${end?'':`<div class="mut">${ST.map((s,k)=>k<=i?`<b>${s}</b>`:s).join(' › ')}</div>`}
 ${o.status=='en route'?`<iframe src="https://maps.google.com/maps?saddr=${src}&daddr=${dest}&output=embed"></iframe>`:''}
 <div class="row">${!end&&o.status!='terminée'?`<button class="bad" onclick="cancel('${o.id}')">Annuler la commande</button>`:''}<button class="sec" onclick="rc('${o.id}')">Reçu PDF</button></div></div>`}).join('')||'<p class="mut">Aucune commande.</p>'}
function cancel(id){if(confirm('Annuler cette commande ?')){setOrder(id,{status:'annulée'});render()}}
function rc(id){const d=D.get(),o=d.orders.find(o=>o.id==id);alert('Dans la fenêtre d\'impression, choisissez « Enregistrer au format PDF ».');printHTML(receipt(d.rests.find(r=>r.id==o.restId),o,'Reçu de commande'))}
setInterval(()=>{const mine=D.get().orders.filter(o=>o.clientId==U.id),cu=Object.fromEntries(mine.map(o=>[o.id,o.status])),sig=JSON.stringify(mine.map(o=>[o.id,o.status,o.driverPos]));
 if(seen){for(const k in cu)if(seen[k]!=cu[k])notify('Commande #'+k,cu[k]);if(tab=='myorders'&&sig!=seenSig)render()}seen=cu;seenSig=sig},2000);
render();
</script>
<script>
(()=> {
 const BASE='./', KEY='restogest_seen_version';
 let deferredInstall=null;
 const banner=document.createElement('div');
 banner.id='rg-update-banner';
 banner.style.cssText='display:none;position:fixed;left:12px;right:12px;bottom:14px;z-index:99999;background:#14213d;color:white;padding:14px 16px;border-radius:16px;box-shadow:0 8px 30px #0005;font:14px/1.45 system-ui';
 banner.innerHTML='<div style="font-weight:700;margin-bottom:5px" id="rg-update-title">Mise à jour disponible</div><div id="rg-update-msg" style="opacity:.9;margin-bottom:10px"></div><div style="display:flex;gap:8px;flex-wrap:wrap"><button id="rg-update-now" style="background:#ffb703;color:#14213d;border:0;border-radius:9px;padding:10px 14px;font-weight:700">Mettre à jour</button><button id="rg-install" style="background:#fff;color:#14213d;border:0;border-radius:9px;padding:10px 14px;font-weight:700">Installer l’application</button><button id="rg-update-close" style="background:transparent;color:#fff;border:1px solid #ffffff66;border-radius:9px;padding:10px 12px">Plus tard</button></div>';
 document.addEventListener('DOMContentLoaded',()=>{
   document.body.appendChild(banner);
   const install=document.getElementById('rg-install');
   install.addEventListener('click',async()=>{
     if(deferredInstall){deferredInstall.prompt();await deferredInstall.userChoice;deferredInstall=null;install.style.display='none'}
     else alert('Pour installer : ouvrez le menu ⋮ de votre navigateur puis choisissez « Installer l’application » ou « Ajouter à l’écran d’accueil ».');
   });
   document.getElementById('rg-update-close').onclick=()=>banner.style.display='none';
   document.getElementById('rg-update-now').onclick=async()=>{
     try{if(navigator.serviceWorker){const reg=await navigator.serviceWorker.getRegistration();if(reg)await reg.update();if(reg&&reg.waiting)reg.waiting.postMessage({type:'SKIP_WAITING'})}}catch(e){}
     location.reload(true);
   };
 });
 addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstall=e;const b=document.getElementById('rg-install');if(b)b.style.display='inline-block';showBanner('Installer RestoGest','Installez l’application sur votre téléphone pour y accéder rapidement.')});
 addEventListener('appinstalled',()=>{deferredInstall=null;const b=document.getElementById('rg-install');if(b)b.style.display='none'});
 function showBanner(title,message){const t=document.getElementById('rg-update-title'),m=document.getElementById('rg-update-msg');if(t)t.textContent=title;if(m)m.textContent=message||'';if(banner)banner.style.display='block'}
 async function checkVersion(){
   try{
    const r=await fetch('./version.json?ts='+Date.now(),{cache:'no-store'});if(!r.ok)return;
    const data=await r.json();if(!data.version)return;
    const seen=localStorage.getItem(KEY);
    if(!seen){localStorage.setItem(KEY,data.version);return}
    if(seen!==String(data.version)){showBanner('Nouvelle version RestoGest disponible',data.message||'Une mise à jour est disponible. Appuyez sur « Mettre à jour ».');}
   }catch(e){}
 }
 checkVersion();setInterval(checkVersion,5*60*1000);
 if('serviceWorker' in navigator && location.protocol.startsWith('http')){
   navigator.serviceWorker.register('./sw.js').catch(()=>{});
 }
})();
</script>
